<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeStash — Free Developer Resource Hub</title>
  <meta name="description" content="The ultimate vault of free developer resources, open-source tools, and public APIs." />
  <meta name="theme-color" content="#0b0f17" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background: #0b0f17;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .glass {
      background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(148,163,184,0.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .card {
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
      animation: rise .4s ease both;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(129,140,248,0.55);
      box-shadow: 0 0 0 1px rgba(129,140,248,0.25), 0 12px 40px -12px rgba(99,102,241,0.45);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .blob { position: fixed; border-radius: 9999px; filter: blur(110px); opacity: .28; pointer-events: none; z-index: 0; }
    .grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(148,163,184,0.045) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(148,163,184,0.045) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at top, #000 25%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at top, #000 25%, transparent 75%);
    }
    .gradient-text {
      background: linear-gradient(90deg, #818cf8, #22d3ee 60%, #34d399);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .chip-active {
      background: linear-gradient(135deg, rgba(99,102,241,.9), rgba(34,211,238,.75));
      border-color: transparent; color: #fff;
      box-shadow: 0 6px 24px -8px rgba(99,102,241,.8);
    }
    .bookmark-on { color: #fbbf24; }
    .bookmark-on svg { fill: #fbbf24; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    :focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }

    /* Footer links */
    .footer-link { display: inline-block; padding: .4rem .75rem; border-radius: .5rem; color: #94a3b8; font-size: .875rem; transition: background .2s, color .2s; }
    .footer-link:hover { background: rgba(255,255,255,.06); color: #fff; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>

<body class="min-h-screen antialiased">
  <div class="grid-bg"></div>
  <div class="blob w-96 h-96 bg-indigo-600 -top-24 -left-24"></div>
  <div class="blob w-80 h-80 bg-cyan-500 top-1/3 -right-24"></div>
  <div class="blob w-72 h-72 bg-emerald-500 bottom-0 left-1/4 opacity-15"></div>

  <div class="relative z-10 flex min-h-screen flex-col">

    <!-- Header / Hero -->
    <header class="mx-auto w-full max-w-6xl px-4 pt-10 sm:px-6 sm:pt-16">
      <div class="flex items-center justify-between">
        <a href="#" class="flex items-center gap-2.5" aria-label="CodeStash home">
          <span class="grid h-10 w-10 place-items-center rounded-xl glass shadow-lg shadow-indigo-500/20">
            <i data-lucide="package-open" class="h-5 w-5 text-indigo-300"></i>
          </span>
          <span class="text-lg font-bold tracking-tight">CodeStash</span>
        </a>
        <a href="https://github.com" target="_blank" rel="noopener noreferrer"
           class="glass inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm text-slate-300 transition hover:text-white">
          <i data-lucide="github" class="h-4 w-4"></i>
          <span class="hidden sm:inline">Star on GitHub</span>
        </a>
      </div>

      <div class="mx-auto mt-12 max-w-3xl text-center sm:mt-16">
        <span class="glass inline-flex items-center gap-2 rounded-full px-3 py-1 text-xs font-medium text-cyan-300">
          <i data-lucide="sparkles" class="h-3.5 w-3.5"></i>
          <span id="totalCount">0</span> hand-picked free resources
        </span>
        <h1 class="mt-5 text-5xl font-extrabold tracking-tight sm:text-7xl">
          <span class="gradient-text">CodeStash</span>
        </h1>
        <p class="mx-auto mt-5 max-w-2xl text-base text-slate-400 sm:text-lg">
          The ultimate vault of free developer resources, open-source tools, and public APIs.
        </p>

        <!-- Search -->
        <div class="relative mx-auto mt-8 max-w-xl">
          <i data-lucide="search" class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-500"></i>
          <input id="search" type="search" autocomplete="off" spellcheck="false"
                 placeholder="Search resources, e.g. “database” or “icons”…"
                 aria-label="Search resources"
                 class="glass w-full rounded-2xl py-4 pl-12 pr-14 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-indigo-400/60 focus:shadow-[0_0_0_4px_rgba(99,102,241,0.15)] sm:text-base" />
          <kbd class="absolute right-4 top-1/2 hidden -translate-y-1/2 rounded-md border border-slate-700 bg-slate-900/70 px-2 py-0.5 font-mono text-xs text-slate-400 sm:block">/</kbd>
        </div>
      </div>
    </header>

    <!-- Controls -->
    <section class="mx-auto mt-10 w-full max-w-6xl px-4 sm:px-6" aria-label="Filters">
      <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <!-- View tabs -->
        <div class="glass inline-flex w-full self-start rounded-xl p-1 sm:w-auto" role="tablist">
          <button id="tab-explore" role="tab" data-view="explore"
                  class="flex flex-1 items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition sm:flex-none">
            <i data-lucide="compass" class="h-4 w-4"></i> Explore
          </button>
          <button id="tab-stash" role="tab" data-view="stash"
                  class="flex flex-1 items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition sm:flex-none">
            <i data-lucide="bookmark" class="h-4 w-4"></i> My Stash
            <span id="stashCount" class="rounded-full bg-slate-800 px-2 py-0.5 font-mono text-xs text-slate-300">0</span>
          </button>
        </div>

        <!-- Category chips -->
        <div id="filters" class="no-scrollbar -mx-4 flex gap-2 overflow-x-auto px-4 pb-1 sm:mx-0 sm:flex-wrap sm:overflow-visible sm:px-0"></div>
      </div>
      <p id="resultInfo" class="mt-5 text-sm text-slate-500" aria-live="polite"></p>
    </section>

    <!-- Grid -->
    <main class="mx-auto w-full max-w-6xl flex-1 px-4 pb-16 pt-4 sm:px-6">
      <div id="grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>

      <div id="empty" class="hidden py-20 text-center">
        <div class="glass mx-auto grid h-16 w-16 place-items-center rounded-2xl">
          <i id="emptyIcon" data-lucide="search-x" class="h-7 w-7 text-slate-400"></i>
        </div>
        <h2 id="emptyTitle" class="mt-5 text-lg font-semibold"></h2>
        <p id="emptyText" class="mx-auto mt-2 max-w-sm text-sm text-slate-500"></p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80">
      <div class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
        <nav aria-label="Footer" class="flex flex-wrap justify-center gap-1 sm:justify-start">
          <a href="about.html" class="footer-link">About Us</a>
          <a href="contact.html" class="footer-link">Contact Us</a>
          <a href="privacy.html" class="footer-link">Privacy Policy</a>
          <a href="terms.html" class="footer-link">Terms &amp; Conditions</a>
        </nav>
        <div class="mt-5 flex flex-col items-center justify-between gap-3 border-t border-slate-800/60 pt-5 text-sm text-slate-500 sm:flex-row">
          <p class="text-center sm:text-left">
            Built for devs, by a dev.
            <a href="https://github.com" target="_blank" rel="noopener noreferrer"
               class="inline-flex items-center gap-1 text-slate-300 underline decoration-slate-600 underline-offset-4 transition hover:text-indigo-300">
              Open-source on GitHub.
            </a>
          </p>
          <p class="font-mono text-xs">© <span id="year"></span> CodeStash</p>
        </div>
      </div>
    </footer>
  </div>

  <!-- Toast -->
  <div id="toast" class="glass pointer-events-none fixed bottom-6 left-1/2 z-50 -translate-x-1/2 translate-y-4 rounded-full px-4 py-2 text-sm opacity-0 transition-all duration-300" role="status"></div>

  <script>
    (function () {
      'use strict';

      /* ---------- Data ---------- */
      const RESOURCES = [
        // APIs
        { name: 'Public APIs', cat: 'APIs', url: 'https://github.com/public-apis/public-apis', desc: 'A massive, community-curated list of free APIs across every category imaginable.' },
        { name: 'JSONPlaceholder', cat: 'APIs', url: 'https://jsonplaceholder.typicode.com', desc: 'Free fake REST API for testing and prototyping. Posts, users, todos and more.' },
        { name: 'Open-Meteo', cat: 'APIs', url: 'https://open-meteo.com', desc: 'Free weather forecast API with no API key required. Open-source and fast.' },
        { name: 'PokéAPI', cat: 'APIs', url: 'https://pokeapi.co', desc: 'RESTful Pokémon data API — a fun, well-documented playground for learning fetch.' },
        { name: 'REST Countries', cat: 'APIs', url: 'https://restcountries.com', desc: 'Get country data: flags, currencies, languages, population and more via REST.' },
        { name: 'Unsplash API', cat: 'APIs', url: 'https://unsplash.com/developers', desc: 'Access millions of high-quality, free-to-use photos in your own apps.' },
        { name: 'CoinGecko API', cat: 'APIs', url: 'https://www.coingecko.com/en/api', desc: 'Crypto prices, market data and exchange info with a free public tier.' },

        // Hosting
        { name: 'Vercel', cat: 'Hosting', url: 'https://vercel.com', desc: 'Frontend cloud with zero-config deploys, previews and a generous hobby tier.' },
        { name: 'Netlify', cat: 'Hosting', url: 'https://www.netlify.com', desc: 'Deploy static sites and serverless functions straight from Git, free to start.' },
        { name: 'Cloudflare Pages', cat: 'Hosting', url: 'https://pages.cloudflare.com', desc: 'Fast global hosting on Cloudflare’s edge with unlimited bandwidth on free plan.' },
        { name: 'GitHub Pages', cat: 'Hosting', url: 'https://pages.github.com', desc: 'Host static sites directly from a GitHub repository — free and dead simple.' },
        { name: 'Supabase', cat: 'Hosting', url: 'https://supabase.com', desc: 'Open-source Firebase alternative: Postgres, Auth, Storage and realtime APIs.' },
        { name: 'Firebase', cat: 'Hosting', url: 'https://firebase.google.com', desc: 'Auth, Firestore, Hosting and Cloud Functions with a no-cost Spark plan.' },
        { name: 'Render', cat: 'Hosting', url: 'https://render.com', desc: 'Host static sites, web services and databases with a free tier for hobby apps.' },
        { name: 'Neon', cat: 'Hosting', url: 'https://neon.tech', desc: 'Serverless Postgres with branching and a free plan that scales to zero.' },

        // UI Components
        { name: 'Tailwind CSS', cat: 'UI Components', url: 'https://tailwindcss.com', desc: 'Utility-first CSS framework for building custom designs without leaving your HTML.' },
        { name: 'shadcn/ui', cat: 'UI Components', url: 'https://ui.shadcn.com', desc: 'Beautifully designed, accessible components you copy into your project and own.' },
        { name: 'DaisyUI', cat: 'UI Components', url: 'https://daisyui.com', desc: 'The most popular Tailwind CSS component library with themes out of the box.' },
        { name: 'Flowbite', cat: 'UI Components', url: 'https://flowbite.com', desc: 'Open-source UI components built on Tailwind CSS: navbars, modals, forms and more.' },
        { name: 'Headless UI', cat: 'UI Components', url: 'https://headlessui.com', desc: 'Completely unstyled, fully accessible UI components designed for Tailwind.' },
        { name: 'Radix UI', cat: 'UI Components', url: 'https://www.radix-ui.com', desc: 'Unstyled, accessible primitives for building high-quality design systems.' },
        { name: 'HyperUI', cat: 'UI Components', url: 'https://www.hyperui.dev', desc: 'Free open-source Tailwind CSS components you can copy and paste into any project.' },

        // Icons
        { name: 'Lucide', cat: 'Icons', url: 'https://lucide.dev', desc: 'Beautiful, consistent open-source icon toolkit — a community fork of Feather.' },
        { name: 'Font Awesome', cat: 'Icons', url: 'https://fontawesome.com', desc: 'The web’s most popular icon set, with a large free collection.' },
        { name: 'Heroicons', cat: 'Icons', url: 'https://heroicons.com', desc: 'Hand-crafted SVG icons by the makers of Tailwind CSS.' },
        { name: 'Phosphor Icons', cat: 'Icons', url: 'https://phosphoricons.com', desc: 'A flexible icon family in six weights for interfaces, diagrams and presentations.' },
        { name: 'Tabler Icons', cat: 'Icons', url: 'https://tabler.io/icons', desc: 'Over 5,000 free, customizable SVG icons under the MIT license.' },
        { name: 'Iconify', cat: 'Icons', url: 'https://iconify.design', desc: 'Unified access to 200,000+ open-source icons from more than a hundred sets.' },
        { name: 'Simple Icons', cat: 'Icons', url: 'https://simpleicons.org', desc: 'Free SVG icons for popular brands — perfect for tech stack sections.' },

        // Tools
        { name: 'GitHub', cat: 'Tools', url: 'https://github.com', desc: 'Host code, collaborate, run CI with Actions and showcase your open-source work.' },
        { name: 'VS Code', cat: 'Tools', url: 'https://code.visualstudio.com', desc: 'Free, open-source code editor with a huge extension ecosystem.' },
        { name: 'Hoppscotch', cat: 'Tools', url: 'https://hoppscotch.io', desc: 'Open-source API client in your browser — a lightweight Postman alternative.' },
        { name: 'Regex101', cat: 'Tools', url: 'https://regex101.com', desc: 'Build, test and debug regular expressions with live explanations.' },
        { name: 'Excalidraw', cat: 'Tools', url: 'https://excalidraw.com', desc: 'Virtual whiteboard for sketching hand-drawn style diagrams, free and open-source.' },
        { name: 'Squoosh', cat: 'Tools', url: 'https://squoosh.app', desc: 'Compress and convert images right in the browser with side-by-side previews.' },
        { name: 'Can I use', cat: 'Tools', url: 'https://caniuse.com', desc: 'Up-to-date browser support tables for HTML, CSS and JavaScript features.' },
        { name: 'DevDocs', cat: 'Tools', url: 'https://devdocs.io', desc: 'Fast, offline-capable API documentation browser combining many docs in one place.' },
        { name: 'Figma', cat: 'Tools', url: 'https://www.figma.com', desc: 'Collaborative interface design tool with a free Starter plan.' }
      ].map((r, i) => ({ ...r, id: r.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') }));

      const CATEGORIES = ['All', 'APIs', 'Hosting', 'UI Components', 'Icons', 'Tools'];
      const CAT_STYLE = {
        'APIs':          { icon: 'plug-zap',     badge: 'text-cyan-300 bg-cyan-400/10 border-cyan-400/25' },
        'Hosting':       { icon: 'cloud',        badge: 'text-emerald-300 bg-emerald-400/10 border-emerald-400/25' },
        'UI Components': { icon: 'layout-grid',  badge: 'text-fuchsia-300 bg-fuchsia-400/10 border-fuchsia-400/25' },
        'Icons':         { icon: 'shapes',       badge: 'text-amber-300 bg-amber-400/10 border-amber-400/25' },
        'Tools':         { icon: 'wrench',       badge: 'text-indigo-300 bg-indigo-400/10 border-indigo-400/25' }
      };

      /* ---------- State ---------- */
      const STORAGE_KEY = 'codestash:stash:v1';
      const state = {
        view: 'explore',
        category: 'All',
        query: '',
        stash: loadStash()
      };

      function loadStash() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          return new Set(Array.isArray(arr) ? arr : []);
        } catch (e) { return new Set(); }
      }
      function saveStash() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...state.stash])); } catch (e) { /* storage unavailable */ }
      }

      /* ---------- Elements ---------- */
      const $ = (id) => document.getElementById(id);
      const els = {
        grid: $('grid'), empty: $('empty'), emptyTitle: $('emptyTitle'), emptyText: $('emptyText'), emptyIcon: $('emptyIcon'),
        filters: $('filters'), search: $('search'), info: $('resultInfo'),
        stashCount: $('stashCount'), total: $('totalCount'), toast: $('toast'),
        tabExplore: $('tab-explore'), tabStash: $('tab-stash')
      };

      /* ---------- Helpers ---------- */
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      let toastTimer;
      function toast(msg) {
        els.toast.textContent = msg;
        els.toast.classList.remove('opacity-0', 'translate-y-4');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => els.toast.classList.add('opacity-0', 'translate-y-4'), 1800);
      }

      function icons() {
        if (window.lucide) window.lucide.createIcons();
      }

      /* ---------- Render ---------- */
      function renderFilters() {
        els.filters.innerHTML = CATEGORIES.map((c) => {
          const active = c === state.category;
          return `<button data-cat="${esc(c)}" aria-pressed="${active}"
            class="glass shrink-0 whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition hover:text-white ${active ? 'chip-active' : 'text-slate-400'}">${esc(c)}</button>`;
        }).join('');
      }

      function renderTabs() {
        const on = 'bg-white/10 text-white shadow-inner';
        const off = 'text-slate-400 hover:text-white';
        els.tabExplore.className = els.tabExplore.className.replace(/bg-white\/10 text-white shadow-inner|text-slate-400 hover:text-white/g, '').trim() + ' ' + (state.view === 'explore' ? on : off);
        els.tabStash.className = els.tabStash.className.replace(/bg-white\/10 text-white shadow-inner|text-slate-400 hover:text-white/g, '').trim() + ' ' + (state.view === 'stash' ? on : off);
        els.tabExplore.setAttribute('aria-selected', state.view === 'explore');
        els.tabStash.setAttribute('aria-selected', state.view === 'stash');
        els.stashCount.textContent = state.stash.size;
      }

      function getVisible() {
        const q = state.query.trim().toLowerCase();
        return RESOURCES.filter((r) => {
          if (state.view === 'stash' && !state.stash.has(r.id)) return false;
          if (state.category !== 'All' && r.cat !== state.category) return false;
          if (!q) return true;
          return (r.name + ' ' + r.cat + ' ' + r.desc).toLowerCase().includes(q);
        });
      }

      function cardHTML(r, i) {
        const s = CAT_STYLE[r.cat];
        const saved = state.stash.has(r.id);
        return `
        <article class="card glass group flex flex-col rounded-2xl p-5" style="animation-delay:${Math.min(i, 12) * 30}ms">
          <div class="flex items-start justify-between gap-3">
            <div class="flex min-w-0 items-center gap-3">
              <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl border border-white/10 bg-white/5">
                <i data-lucide="${s.icon}" class="h-5 w-5 text-slate-200"></i>
              </span>
              <div class="min-w-0">
                <h3 class="truncate text-base font-semibold text-slate-50">${esc(r.name)}</h3>
                <span class="mt-1 inline-block rounded-full border px-2.5 py-0.5 text-[11px] font-medium ${s.badge}">${esc(r.cat)}</span>
              </div>
            </div>
            <button data-bookmark="${esc(r.id)}" aria-pressed="${saved}"
              aria-label="${saved ? 'Remove ' : 'Save '}${esc(r.name)} ${saved ? 'from' : 'to'} stash"
              class="grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-transparent text-slate-500 transition hover:border-white/10 hover:bg-white/5 hover:text-amber-300 ${saved ? 'bookmark-on' : ''}">
              <i data-lucide="bookmark" class="h-[18px] w-[18px]"></i>
            </button>
          </div>
          <p class="mt-4 flex-1 text-sm leading-relaxed text-slate-400">${esc(r.desc)}</p>
          <a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"
             class="mt-5 inline-flex items-center justify-center gap-2 rounded-xl border border-indigo-400/30 bg-indigo-500/10 px-4 py-2.5 text-sm font-medium text-indigo-200 transition hover:bg-indigo-500/25 hover:text-white">
            Visit <i data-lucide="arrow-up-right" class="h-4 w-4 transition group-hover:translate-x-0.5 group-hover:-translate-y-0.5"></i>
          </a>
        </article>`;
      }

      function render() {
        renderTabs();
        renderFilters();
        const list = getVisible();

        els.grid.innerHTML = list.map(cardHTML).join('');
        els.empty.classList.toggle('hidden', list.length > 0);

        if (!list.length) {
          if (state.view === 'stash' && !state.stash.size) {
            els.emptyIcon.setAttribute('data-lucide', 'bookmark-plus');
            els.emptyTitle.textContent = 'Your stash is empty';
            els.emptyText.textContent = 'Tap the bookmark icon on any resource to save it here for quick access.';
          } else {
            els.emptyIcon.setAttribute('data-lucide', 'search-x');
            els.emptyTitle.textContent = 'No resources found';
            els.emptyText.textContent = 'Try a different search term or switch the category filter.';
          }
          // Recreate icon element so Lucide re-renders it
          const fresh = document.createElement('i');
          fresh.id = 'emptyIcon';
          fresh.setAttribute('data-lucide', els.emptyIcon.getAttribute('data-lucide'));
          fresh.className = 'h-7 w-7 text-slate-400';
          els.emptyIcon.replaceWith(fresh);
          els.emptyIcon = fresh;
        }

        const scope = state.view === 'stash' ? 'in your stash' : 'available';
        els.info.textContent = `${list.length} resource${list.length === 1 ? '' : 's'} ${scope}` +
          (state.category !== 'All' ? ` · ${state.category}` : '') +
          (state.query.trim() ? ` · “${state.query.trim()}”` : '');

        icons();
      }

      /* ---------- Events ---------- */
      els.search.addEventListener('input', (e) => { state.query = e.target.value; render(); });

      els.filters.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-cat]');
        if (!btn) return;
        state.category = btn.dataset.cat;
        render();
      });

      [els.tabExplore, els.tabStash].forEach((btn) =>
        btn.addEventListener('click', () => { state.view = btn.dataset.view; render(); })
      );

      els.grid.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-bookmark]');
        if (!btn) return;
        const id = btn.dataset.bookmark;
        const res = RESOURCES.find((r) => r.id === id);
        if (state.stash.has(id)) {
          state.stash.delete(id);
          toast(`Removed ${res.name} from stash`);
        } else {
          state.stash.add(id);
          toast(`Saved ${res.name} to stash`);
        }
        saveStash();
        render();
      });

      // Press "/" to focus search, Escape to clear
      document.addEventListener('keydown', (e) => {
        const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
        if (e.key === '/' && !typing) { e.preventDefault(); els.search.focus(); }
        if (e.key === 'Escape' && document.activeElement === els.search) {
          els.search.value = ''; state.query = ''; els.search.blur(); render();
        }
      });

      // Keep stash in sync across tabs
      window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY) { state.stash = loadStash(); render(); }
      });

      /* ---------- Init ---------- */
      els.total.textContent = RESOURCES.length;
      $('year').textContent = new Date().getFullYear();
      render();
    })();
  </script>
</body>
</html>
